name = "tavolo-dei-dadi-transcribe"
main = "transcribe-worker.js"
compatibility_date = "2024-11-01"

# Le chiavi si impostano come SEGRETI, non qui:
#   wrangler secret put ANTHROPIC_API_KEY   → trascrizione PDF (fallback)
#   wrangler secret put DM_KEY              → password con cui TU leggi l'archivio schede
#   wrangler secret put OLLAMA_URL          → URL Ollama per trascrizione locale (es. https://ollama.tuodominio.com)
#   wrangler secret put OLLAMA_MODEL        → modello vision Ollama (default llava, es. qwen2-vl, llama3.2-vision)
#   wrangler secret put WORKERS_AI_MODEL    → forza un singolo modello Workers AI (default cascata gemma-4/llama-4/qwen/mistral/llava-7b/llama-3.2)
#                                            cascade evita 5016 (EU block llama-3.2) e 5007 (llava-13b rimosso)
#
# Limita il CORS al tuo sito: solo le pagine servite da questa origine possono
# chiamare il Worker (chi ha solo l'URL non lo può usare da un altro sito).
# Se pubblichi il sito altrove, aggiorna questo valore (solo schema+host, senza
# percorso finale).
[vars]
ALLOW_ORIGIN = "https://samuelenigro97-prog.github.io"

# Archivio delle schede (endpoint /pg) + Stanze + Sync via codice.
# Namespace già creato: SCHEDE (id 92ac397f93124d5d98491554205be764)
[[kv_namespaces]]
binding = "SCHEDE"
id = "92ac397f93124d5d98491554205be764"

# Rate limiter nativo consigliato per /room (Wrangler >= 4.36). Scegli un
# namespace_id numerico non usato da altri limiter nello stesso account.
# Se omesso, il Worker applica comunque un limite best-effort tramite SCHEDE.
# [[ratelimits]]
# name = "ROOM_RATE_LIMITER"
# namespace_id = "1001"
#   [ratelimits.simple]
#   limit = 10
#   period = 60

# Workers AI (gratis): per trascrizione immagini/PDF senza chiavi API.
# Richiede Wrangler >= 3.30 e piano Workers (free include 10k req/giorno).
[ai]
binding = "AI"
